<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Laser Jump</title>
  <style>
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden; background-color: #f0f0f0;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      font-family: sans-serif;
    }
    #game-enclosure { text-align: center; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    button {
      background: linear-gradient(145deg,#e6e6e6,#ffffff);
      border: 1px solid #dcdcdc; border-radius: 8px;
      box-shadow: 2px 2px 5px #cccccc,-2px -2px 5px #ffffff;
      padding: 8px 16px; font-size: 16px; cursor: pointer;
      transition: all .2s ease-in-out;
    }
    button:hover {
      background: linear-gradient(145deg,#d4d4d4,#f0f0f0);
      box-shadow: 4px 4px 10px #b0b0b0,-4px -4px 10px #ffffff;
    }
    button:active { background:#e0e0e0; box-shadow: inset 2px 2px 5px #b0b0b0, inset -2px -2px 5px #ffffff; }

    /* Default canvas sizing (desktop & portrait) */
    canvas {
      display:block; margin:0 auto 8px auto;
      width:90vmin; height:90vmin; max-width:500px; max-height:500px;
      border:2px solid black; background:#fff;
      touch-action:none;
    }
    /* Landscape phones: fit to height so whole square is visible */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      canvas {
        width: 90vh !important;
        height: 90vh !important;
        max-width: none; max-height: none;
      }
      .controls { transform: scale(0.95); }
    }

    #instructionsModal {
      display:none; position:fixed; z-index:3; inset:0;
      background:rgba(0,0,0,0.4);
    }
    .modal-content {
      background:#fff; margin:12% auto; padding:20px; border:1px solid #888;
      width:80%; max-width:500px; position:relative; border-radius:10px;
    }
    #closeButton { color:#aaa; position:absolute; right:12px; top:8px; font-size:28px; font-weight:bold; cursor:pointer; }
    #closeButton:hover { color:#000; }

    /* ===== Mobile on-screen controls ===== */
    .touch-ui { display:none; }
    @media (hover: none) and (pointer: coarse) {
      .touch-ui { display:block; }

      /* Left jump zone: fully transparent, no dashed border */
      #jumpArea, #joystickArea {
        position: fixed; z-index: 4; touch-action: none;
        inset: auto;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: transparent;
      }
      /* Left: jump rectangle spans left 35–40% */
      #jumpArea {
        left: 0; top: 0; bottom: 0; width: 38vw; max-width: 420px;
      }
      /* Right: joystick interaction zone spans right 40% */
      #joystickArea {
        right: 0; top: 0; bottom: 0; width: 40vw; max-width: 460px;
      }

      /* Joystick visuals — always visible (faint) */
      #joyBase, #joyStick {
        position: fixed;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; /* visuals don't block touches */
      }
      #joyBase {
        width: 26vmin; height: 26vmin; max-width: 220px; max-height: 220px;
        border: 2px solid rgba(0,0,0,0.15);
        background: rgba(0,0,0,0.04);
        z-index: 4; opacity: 0.5; /* always visible */
      }
      #joyStick {
        width: 12vmin; height: 12vmin; max-width: 110px; max-height: 110px;
        border: 2px solid rgba(0,0,0,0.15);
        background: rgba(0,0,0,0.08);
        z-index: 4; opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <div id="game-enclosure">
    <h1>Laser Jump</h1>
    <div class="controls">
      <button id="pauseButton">Pause</button>
      <button id="instructionsButton">Instructions</button>
      <button id="difficultyButton">Mode: Hard</button>
    </div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <button id="restartButton" style="display:none;">Restart</button>
  </div>

  <!-- Mobile UI overlays -->
  <div class="touch-ui" id="jumpArea"></div>
  <div class="touch-ui" id="joystickArea"></div>
  <div class="touch-ui" id="joyBase"></div>
  <div class="touch-ui" id="joyStick"></div>

  <div id="instructionsModal">
    <div class="modal-content">
      <span id="closeButton">&times;</span>
      <h2>How to Play</h2>
      <ul>
        <li>Desktop: arrow keys to move, Space to jump.</li>
        <li>Mobile: use the <strong>right joystick</strong> to move and tap the <strong>left rectangle</strong> to jump.</li>
        <li>Collect coins; in Hard mode, each coin adds a laser.</li>
      </ul>
    </div>
  </div>

<script>
/* ===== Core setup (same gameplay) ===== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const restartButton = document.getElementById('restartButton');
const pauseButton = document.getElementById('pauseButton');
const instructionsButton = document.getElementById('instructionsButton');
const difficultyButton = document.getElementById('difficultyButton');
const instructionsModal = document.getElementById('instructionsModal');
const closeButton = document.getElementById('closeButton');

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const gameResolution = 500;
const gridSize = 25;
canvas.width = canvas.height = gameResolution;

let player = {
  x: gameResolution/2, y: gameResolution/2,
  radius: gridSize/2,
  speed: isMobile ? 6 : 3, // keep original per-frame speed feel
  vx: 0, vy: 0,
  color: 'blue',
  isJumping: false,
  jumpStartTime: 0,
  jumpDuration: 500,
};
let lasers = [];
let coin = { x: 0, y: 0, radius: gridSize/2, color: 'gold' };
let score = 0, gameOver = false, paused = false, hardMode = true;
const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };

function resetGame(){
  player.x = gameResolution/2; player.y = gameResolution/2;
  player.vx = player.vy = 0; player.isJumping = false; player.color = 'blue';
  lasers = [
    { y: 50, vy: 1.5, height: 5, color: 'red' },
    { x: 50, vx: 1.5, width: 5,  color: 'red' }
  ];
  score = 0; gameOver = false; paused = false;
  spawnCoin();
  restartButton.style.display = 'none';
  pauseButton.textContent = 'Pause';
}
restartButton.addEventListener('click', ()=>{ resetGame(); startGame(); });
difficultyButton.addEventListener('click', ()=>{
  hardMode = !hardMode;
  difficultyButton.textContent = `Mode: ${hardMode ? 'Hard' : 'Easy'}`;
});

window.addEventListener('click', (e)=>{
  if (e.target === instructionsModal){
    instructionsModal.style.display = 'none';
    if (paused) togglePause();
  }
});
function startGame(){ update(); }
function runCountdown(){
  let count = 3;
  (function tick(){
    draw();
    if (count>0){
      ctx.fillStyle='black'; ctx.font='120px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(count, canvas.width/2, canvas.height/2);
      count--; setTimeout(tick,700);
    } else { ctx.textBaseline='alphabetic'; startGame(); }
  })();
}
function togglePause(){
  paused = !paused;
  pauseButton.textContent = paused ? 'Resume' : 'Pause';
  if (!paused) update();
}
pauseButton.addEventListener('click', togglePause);
instructionsButton.addEventListener('click', ()=>{ paused=true; pauseButton.textContent='Resume'; instructionsModal.style.display='block'; });
closeButton.addEventListener('click', ()=>{ instructionsModal.style.display='none'; if (paused) togglePause(); });

function spawnCoin(){
  const pad = coin.radius*2;
  coin.x = pad + Math.random()*(canvas.width - 2*pad);
  coin.y = pad + Math.random()*(canvas.height - 2*pad);
}

/* ===== Desktop keyboard (unchanged) ===== */
document.addEventListener('keydown', e=>{
  if (gameOver){
    if (e.key==='Enter'){ resetGame(); startGame(); }
    return;
  }
  if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
  if (e.key===' ' || e.key==='Spacebar'){
    if (!player.isJumping){
      player.isJumping = true; player.jumpStartTime = Date.now(); player.color='lightblue';
    }
  }
  if (e.key==='p'||e.key==='P') togglePause();
});
document.addEventListener('keyup', e=>{ if (keys.hasOwnProperty(e.key)) keys[e.key]=false; });

/* ===== Mobile on-screen controls ===== */
const jumpArea = document.getElementById('jumpArea');
const joystickArea = document.getElementById('joystickArea');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');

let joyActive = false;
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyMax = 80; // px radius for full deflection

function placeJoystickDefault(){
  // Place the joystick near the bottom-center of the right zone, always visible
  const r = joystickArea.getBoundingClientRect();
  joyCenter.x = r.left + r.width * 0.5;
  joyCenter.y = r.top  + r.height * 0.8;
  joyBase.style.left = joyCenter.x + 'px';
  joyBase.style.top  = joyCenter.y + 'px';
  joyStick.style.left = joyCenter.x + 'px';
  joyStick.style.top  = joyCenter.y + 'px';
}
function adjustJoyMax(){
  const unit = Math.min(window.innerWidth, window.innerHeight);
  joyMax = Math.max(60, Math.min(110, unit * 0.10));
}
function onResize(){
  adjustJoyMax();
  placeJoystickDefault();
}
window.addEventListener('resize', onResize);
if (isMobile) {
  onResize(); // initial placement/sizing
}

if (isMobile){
  // Prevent page gestures inside control areas
  [jumpArea, joystickArea].forEach(el=>{
    ['touchstart','touchmove','touchend','touchcancel'].forEach(evt=>{
      el.addEventListener(evt, e=>e.preventDefault(), {passive:false});
    });
  });

  // Jump (left rectangle) — simple tap/press
  jumpArea.addEventListener('touchstart', ()=>{
    if (gameOver || paused) return;
    if (!player.isJumping){
      player.isJumping = true; player.jumpStartTime = Date.now(); player.color='lightblue';
      if (navigator.vibrate) navigator.vibrate(10);
    }
  }, {passive:false});

  // Joystick (right side)
  joystickArea.addEventListener('touchstart', e=>{
    if (gameOver || paused) return;
    const t = e.changedTouches[0];
    joyId = t.identifier; joyActive = true;
    // Start from wherever the base is (always visible)
    // If user starts far away, keep base where it is; just move stick.
    updateStick(t.clientX, t.clientY);
  }, {passive:false});

  joystickArea.addEventListener('touchmove', e=>{
    if (!joyActive) return;
    let t = null;
    for (let i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier === joyId){ t = e.changedTouches[i]; break; }
    }
    if (!t) return;
    updateStick(t.clientX, t.clientY);
  }, {passive:false});

  function endJoystick(e){
    if (!joyActive) return;
    let ended = false;
    for (let i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier === joyId){ ended = true; break; }
    }
    if (ended){
      joyActive = false; joyId = null;
      // Return stick to center & stop movement
      joyStick.style.left = joyCenter.x + 'px';
      joyStick.style.top  = joyCenter.y + 'px';
      player.vx = 0; player.vy = 0;
    }
  }
  joystickArea.addEventListener('touchend', endJoystick, {passive:false});
  joystickArea.addEventListener('touchcancel', endJoystick, {passive:false});
}

function updateStick(cx, cy){
  const dx = cx - joyCenter.x;
  const dy = cy - joyCenter.y;
  const mag = Math.hypot(dx, dy);
  const capped = Math.min(mag, joyMax);
  const ux = mag ? dx/mag : 0;
  const uy = mag ? dy/mag : 0;

  // Move visual stick
  joyStick.style.left = (joyCenter.x + ux * capped) + 'px';
  joyStick.style.top  = (joyCenter.y + uy * capped) + 'px';

  // Map deflection (0..1) to your per-frame speed; slight ramp for micro control
  const speedFactor = capped / joyMax;
  const currentSpeed = player.speed * (0.35 + 0.65 * speedFactor);
  player.vx = ux * currentSpeed;
  player.vy = uy * currentSpeed;
}

/* ===== Game loop (unchanged logic) ===== */
function checkCollisions(){
  const dx = player.x - coin.x, dy = player.y - coin.y;
  const distance = Math.sqrt(dx*dx + dy*dy);
  if (distance < player.radius + coin.radius){
    score++; spawnCoin();
    if (hardMode){
      if (score % 2 !== 0){
        lasers.push({ y: player.y < canvas.height/2 ? canvas.height - 5 : 0,
                      vy: 1.5 * (Math.random() > 0.5 ? 1 : -1),
                      height: 5, color: 'red' });
      } else {
        lasers.push({ x: player.x < canvas.width/2 ? canvas.width - 5 : 0,
                      vx: 1.5 * (Math.random() > 0.5 ? 1 : -1),
                      width: 5, color: 'red' });
      }
    }
  }
  if (player.isJumping) return;

  lasers.forEach(l=>{
    if (gameOver) return;
    if (l.hasOwnProperty('vy')){
      if (player.y + player.radius > l.y && player.y - player.radius < l.y + l.height) gameOver = true;
    } else if (l.hasOwnProperty('vx')){
      if (player.x + player.radius > l.x && player.x - player.radius < l.x + l.width) gameOver = true;
    }
  });
}

function update(){
  if (paused) return;
  if (gameOver){
    ctx.fillStyle='black'; ctx.font='50px Arial'; ctx.textAlign='center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
    ctx.font='20px Arial'; ctx.fillText('Press Enter to restart', canvas.width/2, canvas.height/2 + 40);
    restartButton.style.display='block';
    return;
  }
  requestAnimationFrame(update);

  if (keys.ArrowUp)    player.y -= player.speed;
  if (keys.ArrowDown)  player.y += player.speed;
  if (keys.ArrowLeft)  player.x -= player.speed;
  if (keys.ArrowRight) player.x += player.speed;

  if (isMobile){ player.x += player.vx; player.y += player.vy; }

  // Wrap-around
  if (player.x < -player.radius) player.x = canvas.width + player.radius;
  if (player.x > canvas.width + player.radius) player.x = -player.radius;
  if (player.y < -player.radius) player.y = canvas.height + player.radius;
  if (player.y > canvas.height + player.radius) player.y = -player.radius;

  // Lasers
  lasers.forEach(l=>{
    if (l.hasOwnProperty('vy')){
      l.y += l.vy;
      if (l.y + l.height > canvas.height || l.y < 0) l.vy *= -1;
    } else {
      l.x += l.vx;
      if (l.x + l.width > canvas.width || l.x < 0) l.vx *= -1;
    }
  });

  // Jump timer
  if (player.isJumping && Date.now() - player.jumpStartTime > player.jumpDuration){
    player.isJumping = false; player.color = 'blue';
  }

  checkCollisions();
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='white'; ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = player.color;
  ctx.beginPath(); ctx.arc(player.x,player.y,player.radius,0,Math.PI*2); ctx.fill();

  lasers.forEach(l=>{
    ctx.fillStyle = l.color;
    if (l.hasOwnProperty('vy')) ctx.fillRect(0, l.y, canvas.width, l.height);
    else ctx.fillRect(l.x, 0, l.width, canvas.height);
  });

  ctx.fillStyle = coin.color;
  ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle='black'; ctx.font='20px Arial'; ctx.textAlign='left';
  ctx.fillText('Score: ' + score, 10, 25);
}

/* Boot */
resetGame();
runCountdown();
</script>
</body>
</html>
