<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Laser Jump</title>
  <style>
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden; background: #f0f0f0;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
    #game-enclosure { text-align: center; }

    /* --- Top controls (Restart first; Pause removed) --- */
    .controls { margin-bottom: 8px; display: flex; gap: 8px; justify-content: center; }
    button {
      background: linear-gradient(145deg,#e6e6e6,#ffffff);
      border: 1px solid #dcdcdc; border-radius: 8px;
      box-shadow: 2px 2px 5px #cccccc,-2px -2px 5px #ffffff;
      padding: 6px 12px; font-size: 15px; cursor: pointer;
    }
    button:active { background:#e0e0e0; }

    /* --- Square canvas always fully visible (portrait & landscape) --- */
    canvas {
      display: block; margin: 0 auto;
      width: 96vmin; height: 96vmin;      /* vmin ensures the whole square fits on screen */
      max-width: 560px; max-height: 560px;/* cap so it doesn't overflow tiny viewports */
      border: 2px solid #000; background: #fff;
      touch-action: none;
    }
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      canvas { width: 98vmin; height: 98vmin; max-width: none; max-height: none; }
    }

    /* --- Modal as before --- */
    #instructionsModal {
      display:none; position:fixed; z-index:3; inset:0; background:rgba(0,0,0,0.4);
    }
    .modal-content {
      background:#fff; margin:12% auto; padding:20px; border:1px solid #888;
      width:80%; max-width:500px; border-radius:10px; position:relative;
    }
    #closeButton { position:absolute; right:12px; top:8px; font-size:24px; cursor:pointer; }

    /* --- Mobile touch UI --- */
    .touch-ui { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .touch-ui { display: block; }

      /* Small jump rectangle (bottom-left) */
      #jumpArea {
        position: fixed; left: 2.5vw; bottom: 6vh;
        width: 18vmin; height: 9vmin;        /* small! */
        min-width: 70px; min-height: 40px;   /* keeps usable on small phones */
        border: 2px solid rgba(0,0,0,0.2);
        border-radius: 12px;
        z-index: 4; touch-action: none; background: rgba(0,0,0,0.03);
      }

      /* Right-side joystick interaction zone (full height right strip) */
      #joystickArea {
        position: fixed; right: 0; top: 0; bottom: 0;
        width: 45vw; max-width: 520px;
        z-index: 4; touch-action: none; background: transparent;
      }

      /* Joystick visuals: appear where the user first touches, hide when released */
      #joyBase, #joyStick {
        position: fixed; border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; z-index: 5; display: none;
      }
      #joyBase {
        width: 24vmin; height: 24vmin; max-width: 200px; max-height: 200px;
        border: 2px solid rgba(0,0,0,0.18);
        background: rgba(0,0,0,0.04);
      }
      #joyStick {
        width: 11vmin; height: 11vmin; max-width: 95px; max-height: 95px;
        border: 2px solid rgba(0,0,0,0.22);
        background: rgba(0,0,0,0.1);
      }
    }
  </style>
</head>
<body>
  <div id="game-enclosure">
    <div class="controls">
      <button id="restartButton" style="display:none;">Restart</button>
      <button id="instructionsButton">Instructions</button>
      <button id="difficultyButton">Mode: Hard</button>
    </div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
  </div>

  <!-- Mobile overlays -->
  <div class="touch-ui" id="jumpArea" aria-label="Jump"></div>
  <div class="touch-ui" id="joystickArea" aria-label="Joystick area"></div>
  <div class="touch-ui" id="joyBase"></div>
  <div class="touch-ui" id="joyStick"></div>

  <!-- Instructions -->
  <div id="instructionsModal">
    <div class="modal-content">
      <span id="closeButton">&times;</span>
      <h2>How to Play</h2>
      <ul>
        <li>Desktop: arrow keys to move, Space to jump.</li>
        <li>Mobile: right-side joystick to move (appears where you touch), left rectangle to jump.</li>
        <li>Collect coins to score; in Hard mode, each coin adds a laser.</li>
      </ul>
    </div>
  </div>

<script>
/* ===== Core setup (your gameplay unchanged) ===== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const restartButton = document.getElementById('restartButton');
const instructionsButton = document.getElementById('instructionsButton');
const difficultyButton = document.getElementById('difficultyButton');
const instructionsModal = document.getElementById('instructionsModal');
const closeButton = document.getElementById('closeButton');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const gameResolution = 500;
const gridSize = 25;
canvas.width = canvas.height = gameResolution;

let player = {
  x: gameResolution/2, y: gameResolution/2,
  radius: gridSize/2,
  speed: isMobile ? 6 : 3, // per-frame feel as before
  vx: 0, vy: 0,
  color: 'blue',
  isJumping: false,
  jumpStartTime: 0,
  jumpDuration: 500,
};
let lasers = [];
let coin = { x: 0, y: 0, radius: gridSize/2, color: 'gold' };
let score = 0, gameOver = false, paused = false, hardMode = true;
const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };

function resetGame(){
  player.x = gameResolution/2; player.y = gameResolution/2;
  player.vx = player.vy = 0; player.isJumping = false; player.color = 'blue';
  lasers = [
    { y: 50, vy: 1.5, height: 5, color: 'red' },
    { x: 50, vx: 1.5, width: 5,  color: 'red' }
  ];
  score = 0; gameOver = false; paused = false;
  spawnCoin();
  restartButton.style.display = 'none';
}
restartButton.addEventListener('click', ()=>{ resetGame(); startGame(); });
difficultyButton.addEventListener('click', ()=>{
  hardMode = !hardMode;
  difficultyButton.textContent = `Mode: ${hardMode ? 'Hard' : 'Easy'}`;
});

instructionsButton.addEventListener('click', ()=>{ paused=true; instructionsModal.style.display='block'; });
closeButton.addEventListener('click', ()=>{ instructionsModal.style.display='none'; if (paused){ paused=false; update(); } });
window.addEventListener('click', (e)=>{ if (e.target===instructionsModal){ instructionsModal.style.display='none'; if (paused){ paused=false; update(); } } });

function spawnCoin(){
  const pad = coin.radius*2;
  coin.x = pad + Math.random()*(canvas.width - 2*pad);
  coin.y = pad + Math.random()*(canvas.height - 2*pad);
}

/* ===== Desktop keyboard (unchanged) ===== */
document.addEventListener('keydown', e=>{
  if (gameOver){
    if (e.key==='Enter'){ resetGame(); startGame(); }
    return;
  }
  if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
  if ((e.key===' '||e.key==='Spacebar') && !player.isJumping){
    player.isJumping = true; player.jumpStartTime = Date.now(); player.color='lightblue';
  }
});
document.addEventListener('keyup', e=>{ if (keys.hasOwnProperty(e.key)) keys[e.key]=false; });

/* ===== Mobile on-screen controls (SMALL jump, DYNAMIC joystick) ===== */
const jumpArea = document.getElementById('jumpArea');
const joystickArea = document.getElementById('joystickArea');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');

let joyActive = false;
let joyId = null;
let joyCenter = { x: 0, y: 0 };
let joyMax = 100;                 // radius for full deflection (px)
let joyTargetVx = 0, joyTargetVy = 0; // target velocity; we ease toward it

function adjustJoyMax(){
  const unit = Math.min(window.innerWidth, window.innerHeight);
  joyMax = Math.max(80, Math.min(130, unit * 0.12));
}
window.addEventListener('resize', adjustJoyMax);
if (isMobile) adjustJoyMax();

// Make jump work
if (isMobile){
  jumpArea.addEventListener('touchstart', ()=>{
    if (gameOver || paused) return;
    if (!player.isJumping){
      player.isJumping = true; player.jumpStartTime = Date.now(); player.color = 'lightblue';
      if (navigator.vibrate) navigator.vibrate(10);
    }
  }, {passive:false});

  // Dynamic joystick: base appears where you touch, then follows until release
  joystickArea.addEventListener('touchstart', e=>{
    if (gameOver || paused) return;
    const t = e.changedTouches[0];
    joyId = t.identifier; joyActive = true;

    joyCenter.x = t.clientX; joyCenter.y = t.clientY;
    joyBase.style.left = joyCenter.x + 'px';
    joyBase.style.top  = joyCenter.y + 'px';
    joyStick.style.left = joyCenter.x + 'px';
    joyStick.style.top  = joyCenter.y + 'px';
    joyBase.style.display = 'block';
    joyStick.style.display = 'block';

    updateStick(t.clientX, t.clientY); // initialize velocity
    e.preventDefault();
  }, {passive:false});

  joystickArea.addEventListener('touchmove', e=>{
    if (!joyActive) return;
    let t = null;
    for (let i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier === joyId){ t = e.changedTouches[i]; break; }
    }
    if (!t) return;
    updateStick(t.clientX, t.clientY);
    e.preventDefault();
  }, {passive:false});

  function endJoystick(e){
    if (!joyActive) return;
    let ended = false;
    for (let i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier === joyId){ ended = true; break; }
    }
    if (ended){
      joyActive = false; joyId = null;
      joyTargetVx = 0; joyTargetVy = 0;
      joyBase.style.display = 'none';
      joyStick.style.display = 'none';
      e.preventDefault();
    }
  }
  joystickArea.addEventListener('touchend', endJoystick, {passive:false});
  joystickArea.addEventListener('touchcancel', endJoystick, {passive:false});
}

function updateStick(cx, cy){
  const dx = cx - joyCenter.x;
  const dy = cy - joyCenter.y;
  const mag = Math.hypot(dx, dy);
  const capped = Math.min(mag, joyMax);
  const ux = mag ? dx/mag : 0;
  const uy = mag ? dy/mag : 0;

  joyStick.style.left = (joyCenter.x + ux * capped) + 'px';
  joyStick.style.top  = (joyCenter.y + uy * capped) + 'px';

  // Smooth acceleration curve: keeps micro-movements precise, max matches your speed
  const speedFactor = capped / joyMax;                // 0..1
  const currentSpeed = player.speed * (0.28 + 0.72*speedFactor);
  joyTargetVx = ux * currentSpeed;
  joyTargetVy = uy * currentSpeed;
}

/* ===== Game loop (with joystick smoothing) ===== */
function checkCollisions(){
  const dx = player.x - coin.x, dy = player.y - coin.y;
  if (Math.hypot(dx,dy) < player.radius + coin.radius){
    score++; spawnCoin();
    if (hardMode){
      if (score % 2){
        lasers.push({ y: player.y < canvas.height/2 ? canvas.height - 5 : 0,
                      vy: 1.5 * (Math.random() > 0.5 ? 1 : -1), height: 5, color: 'red' });
      } else {
        lasers.push({ x: player.x < canvas.width/2 ? canvas.width - 5 : 0,
                      vx: 1.5 * (Math.random() > 0.5 ? 1 : -1), width: 5, color: 'red' });
      }
    }
  }
  if (player.isJumping) return;

  for (const l of lasers){
    if (l.vy !== undefined){
      if (player.y + player.radius > l.y && player.y - player.radius < l.y + l.height){ gameOver = true; break; }
    } else {
      if (player.x + player.radius > l.x && player.x - player.radius < l.x + l.width){ gameOver = true; break; }
    }
  }
}

function update(){
  if (paused) return;
  if (gameOver){
    ctx.fillStyle='black'; ctx.font='40px Arial'; ctx.textAlign='center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
    restartButton.style.display='inline-block';
    return;
  }
  requestAnimationFrame(update);

  // Keyboard (desktop)
  if (keys.ArrowUp)    player.y -= player.speed;
  if (keys.ArrowDown)  player.y += player.speed;
  if (keys.ArrowLeft)  player.x -= player.speed;
  if (keys.ArrowRight) player.x += player.speed;

  // Joystick smoothing (mobile)
  if (isMobile){
    const ease = 0.22; // 0.15 smoother, 0.30 snappier
    player.vx = player.vx * (1 - ease) + joyTargetVx * ease;
    player.vy = player.vy * (1 - ease) + joyTargetVy * ease;
    player.x += player.vx;
    player.y += player.vy;
  }

  // Wrap-around
  if (player.x < -player.radius) player.x = canvas.width + player.radius;
  if (player.x > canvas.width + player.radius) player.x = -player.radius;
  if (player.y < -player.radius) player.y = canvas.height + player.radius;
  if (player.y > canvas.height + player.radius) player.y = -player.radius;

  // Lasers bounce
  for (const l of lasers){
    if (l.vy !== undefined){
      l.y += l.vy;
      if (l.y + l.height > canvas.height || l.y < 0) l.vy *= -1;
    } else {
      l.x += l.vx;
      if (l.x + l.width > canvas.width || l.x < 0) l.vx *= -1;
    }
  }

  // Jump end
  if (player.isJumping && Date.now() - player.jumpStartTime > player.jumpDuration){
    player.isJumping = false; player.color = 'blue';
  }

  checkCollisions();
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle = player.color;
  ctx.beginPath(); ctx.arc(player.x,player.y,player.radius,0,Math.PI*2); ctx.fill();

  // Lasers
  for (const l of lasers){
    ctx.fillStyle = l.color;
    if (l.vy !== undefined) ctx.fillRect(0, l.y, canvas.width, l.height);
    else ctx.fillRect(l.x, 0, l.width, canvas.height);
  }

  // Coin
  ctx.fillStyle = coin.color;
  ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI*2); ctx.fill();

  // HUD
  ctx.fillStyle='#000'; ctx.font='18px Arial'; ctx.textAlign='left';
  ctx.fillText('Score: '+score, 10, 22);
}

/* Boot */
function startGame(){ update(); }
function runCountdown(){
  let count=3;
  (function tick(){
    draw();
    if(count>0){
      ctx.fillStyle='black'; ctx.font='100px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(count, canvas.width/2, canvas.height/2);
      count--; setTimeout(tick, 700);
    } else { ctx.textBaseline='alphabetic'; startGame(); }
  })();
}
resetGame();
runCountdown();
</script>
</body>
</html>
